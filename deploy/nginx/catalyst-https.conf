# Existing EC2 MVP endpoint. Certbot standalone owns port 80 during renewals.
# The Python API remains bound to loopback and managed by its existing screen.
server {
    listen 443 ssl;
    server_name 35.92.254.142;

    ssl_certificate /etc/letsencrypt/live/35.92.254.142/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/35.92.254.142/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;

    # Do not retain API requests, URLs, credentials or response bodies.
    # Nginx configuration/startup diagnostics remain in its global error log.
    access_log off;
    error_log /dev/null;
    client_max_body_size 12m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8778;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
    }
}
