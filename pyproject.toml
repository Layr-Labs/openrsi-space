[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-research"
version = "0.1.0"
description = "A local research catalog and budget-aware viewer for Dungeness evaluations."
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[project.scripts]
catalyst = "catalyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalyst = ["static/*", "runtime/*.py", "problem-set/*.json", "local_fixture/*"]
