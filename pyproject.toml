[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "catalyst-research"
version = "0.1.0"
description = "A local research catalog and budget-aware viewer for Dungeness evaluations."
requires-python = ">=3.11"
dependencies = [
    "pyjwt[crypto]==2.10.1",
    "PyYAML==6.0.3",
]

[project.scripts]
catalyst = "catalyst.cli:main"

[project.optional-dependencies]
s3 = [
    "boto3>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
catalyst = ["static/*", "runtime/*.py", "runtime/*.patch", "problem-set/*.json", "local_fixture/*"]
