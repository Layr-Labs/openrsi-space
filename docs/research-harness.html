h4,

h3,

b,

}

}

.table :is(th, td):last-child {

}

.table :is(caption, thead th) {

}

.table thead th {

}

.table tbody tr:last-child :is(th, td) {

}

}

.table.table-sm :is(th, td):not(:last-child) {

}

}

.table :is(.text-center, [align=&quot;center&quot;]) {

}

.table .text-nowrap {

}

#widget {

  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;

}

.card {

  corner-shape: var(--corner-shape);

.tabular-nums {

.btn,

      ${state.query?`&lt;button type=&quot;button&quot; class=&quot;rh-button rh-button-plain cursor-interaction&quot; data-action=&quot;clear-search&quot; aria-label=&quot;Clear search&quot;&gt;${icon(&#x27;x&#x27;)}&lt;/button&gt;`:&#x27;&#x27;}
      &lt;button class=&quot;rh-button rh-button-primary cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;search&quot;&gt;Search&lt;/button&gt;
    &lt;/form&gt;
    &lt;div class=&quot;rh-filters&quot;&gt;
      &lt;div class=&quot;rh-field&quot;&gt;&lt;label for=&quot;rh-domain&quot;&gt;Research field&lt;/label&gt;&lt;select id=&quot;rh-domain&quot; data-filter=&quot;domain&quot;&gt;${option(&#x27;all&#x27;,&#x27;All fields&#x27;,state.domain)}${domains.map(d=&gt;option(d,d,state.domain)).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;rh-field rh-field-model&quot;&gt;&lt;label for=&quot;rh-model&quot;&gt;Model · fictional&lt;/label&gt;&lt;select id=&quot;rh-model&quot; data-filter=&quot;model&quot;&gt;${option(&#x27;large&#x27;,modelName(&#x27;large&#x27;),state.model)}${option(&#x27;small&#x27;,modelName(&#x27;small&#x27;),state.model)}&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;rh-field&quot;&gt;&lt;label for=&quot;rh-cost&quot;&gt;Average cost / run&lt;/label&gt;&lt;select id=&quot;rh-cost&quot; data-filter=&quot;maxCost&quot;&gt;${[25,10,5].map(n=&gt;option(n,`Up to $${n}`,state.maxCost)).join(&#x27;&#x27;)}&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;rh-field&quot;&gt;&lt;label for=&quot;rh-evidence&quot;&gt;Evidence&lt;/label&gt;&lt;select id=&quot;rh-evidence&quot; data-filter=&quot;evidence&quot;&gt;${option(&#x27;all&#x27;,&#x27;All evidence&#x27;,state.evidence)}${option(&#x27;checked&#x27;,&#x27;Independently checked&#x27;,state.evidence)}${option(&#x27;reported&#x27;,&#x27;Self-reported&#x27;,state.evidence)}&lt;/select&gt;&lt;/div&gt;
      &lt;div class=&quot;rh-field&quot;&gt;&lt;label for=&quot;rh-environment&quot;&gt;Execution setting&lt;/label&gt;&lt;select id=&quot;rh-environment&quot; data-filter=&quot;environment&quot;&gt;${option(&#x27;restricted&#x27;,&#x27;Restricted internet&#x27;,state.environment)}${option(&#x27;internet&#x27;,&#x27;Internet enabled&#x27;,state.environment)}&lt;/select&gt;&lt;/div&gt;
    &lt;/div&gt;`;
  }
  function tabs() {
    return `&lt;div class=&quot;rh-tabs-bar&quot;&gt;&lt;nav class=&quot;rh-tabs&quot; aria-label=&quot;Explore&quot;&gt;
      ${[[&#x27;matrix&#x27;,&#x27;Matrix&#x27;,&#x27;table-2&#x27;,&#x27;&#x27;],[&#x27;problems&#x27;,&#x27;Problems&#x27;,&#x27;book-open&#x27;,allProblems().length],[&#x27;harnesses&#x27;,&#x27;Harnesses&#x27;,&#x27;boxes&#x27;,allHarnesses().length]].map(([id,label,ic,n])=&gt;`&lt;button type=&quot;button&quot; class=&quot;rh-tab cursor-interaction&quot; data-action=&quot;tab&quot; data-value=&quot;${id}&quot;${state.view===id?&#x27; aria-current=&quot;page&quot;&#x27;:&#x27;&#x27;}&gt;${icon(ic)}${label}${n?`&lt;span class=&quot;rh-count&quot;&gt;${n}&lt;/span&gt;`:&#x27;&#x27;}&lt;/button&gt;`).join(&#x27;&#x27;)}
    &lt;/nav&gt;&lt;button type=&quot;button&quot; class=&quot;rh-button rh-button-plain cursor-interaction&quot; data-action=&quot;tour-start&quot;&gt;${icon(&#x27;circle-play&#x27;)}Play walkthrough&lt;/button&gt;&lt;/div&gt;`;
  }
  function empty(title, description, action=&#x27;reset&#x27;, label=&#x27;Reset filters&#x27;) {
    return `&lt;div class=&quot;rh-empty&quot;&gt;&lt;h3&gt;${esc(title)}&lt;/h3&gt;&lt;p&gt;${esc(description)}&lt;/p&gt;${button(label,action)}&lt;/div&gt;`;
  }
  function matrix() {
    const {ps,hs} = selection();
    if (!ps.length || !hs.length) return empty(&#x27;No matching problems or harnesses&#x27;,`Try “lattice”, “proof”, or “graph”, or select another research field.`);
    const visible = ps.flatMap(p=&gt;hs.map(h=&gt;getRecord(p.id,h.id))).filter(passes);
    const totalPairs = ps.length*hs.length;
    return `&lt;div class=&quot;rh-result-info&quot;&gt;&lt;div class=&quot;rh-summary&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;${ps.length} problems × ${hs.length} harnesses&lt;/strong&gt;&lt;span&gt; · ${visible.length} visible results${state.query?&#x27; for “&#x27;+esc(state.query)+&#x27;”&#x27;:&#x27;&#x27;}&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;rh-segment&quot; aria-label=&quot;Matrix values&quot;&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;measure&quot; data-value=&quot;performance&quot; aria-pressed=&quot;${state.measure===&#x27;performance&#x27;}&quot;&gt;Performance&lt;/button&gt;&lt;button type=&quot;button&quot; class=&quot;cursor-interaction&quot; data-action=&quot;measure&quot; data-value=&quot;cost&quot; aria-pressed=&quot;${state.measure===&#x27;cost&#x27;}&quot;&gt;Cost&lt;/button&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;rh-table-wrap&quot;&gt;&lt;table class=&quot;rh-table&quot; aria-label=&quot;Research problem by harness matrix&quot; style=&quot;${hs.length&lt;4?&#x27;min-width:570px;&#x27;:&#x27;&#x27;}&quot;&gt;
      &lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot; class=&quot;rh-problem-col&quot;&gt;&lt;div class=&quot;rh-col-title&quot;&gt;Research problem ${icon(&#x27;arrow-down&#x27;)}&lt;/div&gt;&lt;div class=&quot;rh-col-sub&quot; style=&quot;margin-top:4px&quot;&gt;Problem-specific performance&lt;/div&gt;&lt;/th&gt;
      ${hs.map(h=&gt;`&lt;th scope=&quot;col&quot;&gt;&lt;button class=&quot;rh-col-button cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;harness&quot; data-id=&quot;${h.id}&quot;&gt;&lt;span class=&quot;rh-col-title&quot;&gt;${esc(h.name)}&lt;/span&gt;&lt;span class=&quot;rh-col-sub&quot;&gt;v${esc(h.version)} · ${esc(h.subtitle)}&lt;/span&gt;&lt;/button&gt;&lt;/th&gt;`).join(&#x27;&#x27;)}&lt;/tr&gt;&lt;/thead&gt;
      &lt;tbody&gt;${ps.map(p=&gt;{
        const rowRecords = hs.map(h=&gt;getRecord(p.id,h.id)).filter(passes);
        const vals = rowRecords.map(r=&gt;state.measure===&#x27;cost&#x27;?-r.cost:r.value*p.direction);
        const low = Math.min(...vals), high = Math.max(...vals);
        return `&lt;tr&gt;&lt;th scope=&quot;row&quot; class=&quot;rh-problem-col&quot;&gt;&lt;button class=&quot;rh-problem-button cursor-interaction&quot; type=&quot;button&quot; data-action=&quot;problem&quot; data-id=&quot;${p.id}&quot;&gt;${esc(p.name)}&lt;/button&gt;${p.later?&#x27;&lt;span class=&quot;rh-later&quot;&gt;LATER PROBLEM&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;div class=&quot;rh-row-meta&quot;&gt;${esc(p.short)}&lt;/div&gt;&lt;/th&gt;${hs.map(h=&gt;{
          const r = getRecord(p.id,h.id);
          if (!r) return `&lt;td&gt;&lt;div class=&quot;rh-blank&quot; aria-label=&quot;${esc(p.name)}, ${esc(h.name)}: not evaluated&quot;&gt;&lt;span&gt;—&lt;/span&gt;&lt;span&gt;Not evaluated&lt;/span&gt;&lt;/div&gt;&lt;/td&gt;`;
          if (!passes(r)) return `&lt;td&gt;&lt;div class=&quot;rh-filtered&quot;&gt;${r.cost&gt;state.maxCost?&#x27;Over cost limit&lt;br&gt;&#x27;+money(r.cost)+&#x27;/run&#x27;:r.checked?&#x27;Checked · filtered&#x27;:&#x27;Self-reported&lt;br&gt;Filtered out&#x27;}&lt;/div&gt;&lt;/td&gt;`;
          const val = state.measure===&#x27;cost&#x27;?-r.cost:r.value*p.direction;
          const relative = high===low?0:(val-low)/(high-low);
          const level = relative&gt;.78?&#x27;high&#x27;:relative&gt;.3?&#x27;mid&#x27;:&#x27;low&#x27;;
          return `&lt;td&gt;&lt;button type=&quot;button&quot; class=&quot;rh-cell cursor-interaction&quot; data-action=&quot;run&quot; data-id=&quot;${r.id}&quot; data-level=&quot;${level}&quot; aria-label=&quot;${esc(p.name)} using ${esc(h.name)}: ${format(p,r.value)}, ${money(r.cost)} average per run, ${r.checked?&#x27;independently checked&#x27;:&#x27;self-reported&#x27;}. Open run record.&quot;&gt;&lt;span class=&quot;rh-value&quot;&gt;${state.measure===&#x27;cost&#x27;?money(r.cost):format(p,r.value)}&lt;/span&gt;&lt;span class=&quot;rh-cell-cost&quot;&gt;${state.measure===&#x27;cost&#x27;?format(p,r.value)+&#x27; · &#x27;+esc(p.metric):money(r.cost)+&#x27; / run&#x27;}&lt;/span&gt;${badge(r.checked)}&lt;/button&gt;&lt;/td&gt;`;
        }).join(&#x27;&#x27;)}&lt;/tr&gt;`;
      }).join(&#x27;&#x27;)}&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
    &lt;div class=&quot;rh-table-note&quot;&gt;&lt;div class=&quot;rh-legend&quot;&gt;&lt;span&gt;${icon(&#x27;badge-check&#x27;)}Independently checked&lt;/span&gt;&lt;span&gt;${icon(&#x27;circle-dashed&#x27;)}Self-reported&lt;/span&gt;&lt;span&gt;— Not evaluated&lt;/span&gt;&lt;/div&gt;&lt;span&gt;Shading compares ${state.measure===&#x27;cost&#x27;?&#x27;cost&#x27;:&#x27;performance&#x27;} within each row.&lt;/span&gt;&lt;/div&gt;
    ${!visible.length?`&lt;div class=&quot;rh-notice&quot; style=&quot;margin-top:15px&quot;&gt;No results match this model, setting, and evidence filter. Empty entries do not indicate failure.${button(&#x27;Reset filters&#x27;,&#x27;reset&#x27;)}&lt;/div&gt;`:&#x27;&#x27;}
    &lt;div class=&quot;rh-config&quot;&gt;${icon(&#x27;settings-2&#x27;)}&lt;span&gt;Comparable run limits: &lt;strong&gt;$25 / run · 30 min · 10 runs per pair&lt;/strong&gt;&lt;/span&gt;&lt;span&gt;·&lt;/span&gt;&lt;span&gt;${totalPairs-visible.length} empty or filtered entries&lt;/span&gt;&lt;span&gt;· Cost filter uses observed averages.&lt;/span&gt;&lt;/div&gt;`;
  }
  function catalogProblems() {
    const ps = allProblems().filter(p=&gt;(state.domain===&#x27;all&#x27;||p.domain===state.domain)&amp;&amp;match(p,state.query));
    if (!ps.length) return empty(&#x27;No matching problems&#x27;,&#x27;Try a different term or research field.&#x27;);
    return `&lt;div class=&quot;rh-result-info&quot;&gt;&lt;span class=&quot;rh-summary&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;${ps.length} research problems&lt;/strong&gt; · each with its own evaluation criterion&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;rh-catalog&quot;&gt;${ps.map(p=&gt;{
      const rs=records.filter(r=&gt;r.problem===p.id&amp;&amp;r.model===state.model&amp;&amp;r.environment===state.environment&amp;&amp;passes(r));
      return `&lt;article class=&quot;rh-item&quot;&gt;&lt;div class=&quot;rh-item-top&quot;&gt;&lt;span class=&quot;rh-mono&quot;&gt;${esc(p.code)}&lt;/span&gt;&lt;span class=&quot;rh-tag&quot;&gt;${esc(p.domain)}&lt;/span&gt;&lt;/div&gt;&lt;h3&gt;${esc(p.name)}&lt;/h3&gt;&lt;p&gt;${esc(p.description)}&lt;/p&gt;&lt;div class=&quot;rh-tags&quot;&gt;&lt;span class=&quot;rh-tag&quot;&gt;${esc(p.short)}&lt;/span&gt;${p.later?&#x27;&lt;span class=&quot;rh-tag&quot;&gt;Later problem · transfer evidence&lt;/span&gt;&#x27;:&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;rh-item-bottom&quot;&gt;&lt;span&gt;${rs.length} matching results&lt;/span&gt;${button(&#x27;Explore problem &#x27;+icon(&#x27;arrow-up-right&#x27;),&#x27;problem&#x27;,`data-id=&quot;${p.id}&quot;`)}&lt;/div&gt;&lt;/article&gt;`;
    }).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }
  function catalogHarnesses(savedOnly=false) {
    const hs = allHarnesses().filter(h=&gt;(!savedOnly||state.saved.includes(h.id))&amp;&amp;(state.domain===&#x27;all&#x27;||h.domain===state.domain||h.domain===&#x27;General&#x27;)&amp;&amp;match(h,state.query));
    if (!hs.length) return savedOnly?empty(&#x27;No saved harnesses in this view&#x27;,&#x27;Save a harness from its profile to build a shortlist.&#x27;,&#x27;browse-harnesses&#x27;,&#x27;Explore harnesses&#x27;):empty(&#x27;No matching harnesses&#x27;,&#x27;Try a method such as “proof”, “Python”, or “lattice”.&#x27;);
    return `&lt;div class=&quot;rh-result-info&quot;&gt;&lt;span class=&quot;rh-summary&quot; aria-live=&quot;polite&quot;&gt;&lt;strong&gt;${hs.length} ${savedOnly?&#x27;saved&#x27;:&#x27;reusable&#x27;} harnesses&lt;/strong&gt; · inspect the method behind the result&lt;/span&gt;${savedOnly?button(&#x27;Show all harnesses&#x27;,&#x27;browse-harnesses&#x27;):&#x27;&#x27;}&lt;/div&gt;&lt;div class=&quot;rh-catalog&quot;&gt;${hs.map(h=&gt;{
      const rs=records.filter(r=&gt;r.harness===h.id&amp;&amp;r.model===state.model&amp;&amp;r.environment===state.environment&amp;&amp;passes(r));
      return `&lt;article class=&quot;rh-item&quot;&gt;&lt;div class=&quot;rh-item-top&quot;&gt;&lt;div class=&quot;rh-item-heading&quot;&gt;&lt;span class=&quot;rh-item-icon&quot;&gt;${icon(h.icon)}&lt;/span&gt;&lt;div&gt;&lt;h3&gt;${esc(h.name)}&lt;/h3&gt;&lt;span class=&quot;rh-mono&quot;&gt;v${esc(h.version)} · ${esc(h.author)}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&lt;button type=&quot;button&quot; class=&quot;rh-button rh-button-plain cursor-interaction&quot; data-action=&quot;save&quot; data-id=&quot;${h.id}&quot; aria-label=&quot;${state.saved.includes(h.id)?&#x27;Unsave&#x27;:&#x27;Save&#x27;} ${esc(h.name)}&quot; aria-pressed=&quot;${state.saved.includes(h.id)}&quot;&gt;${icon(state.saved.includes(h.id)?&#x27;bookmark-check&#x27;:&#x27;bookmark&#x27;)}&lt;/button&gt;&lt;/div&gt;&lt;p&gt;${esc(h.description)}&lt;/p&gt;&lt;div class=&quot;rh-tags&quot;&gt;${h.tags.map(t=&gt;`&lt;span class=&quot;rh-tag&quot;&gt;${esc(t)}&lt;/span&gt;`).join(&#x27;&#x27;)}&lt;/div&gt;&lt;div class=&quot;rh-item-bottom&quot;&gt;&lt;span&gt;${rs.length} results · ${rs.filter(r=&gt;r.checked).length} checked&lt;/span&gt;${button(&#x27;View harness &#x27;+icon(&#x27;arrow-up-right&#x27;),&#x27;harness&#x27;,`data-id=&quot;${h.id}&quot;`)}&lt;/div&gt;&lt;/article&gt;`;
    }).join(&#x27;&#x27;)}&lt;/div&gt;`;
  }
  function explorer() {
    return `&lt;div class=&quot;rh-heading&quot;&gt;&lt;div&gt;&lt;div class=&quot;rh-eyebrow&quot;&gt;The research method explorer&lt;/div&gt;&lt;h1&gt;Find your next research method.&lt;/h1&gt;&lt;p class=&quot;rh-subtitle&quot;&gt;Compare reusable harnesses on the problems you care about, with cost and evidence in view.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;rh-heading-meta&quot;&gt;&lt;strong&gt;${allProblems().length}&lt;/strong&gt; problems · &lt;strong&gt;${allHarnesses().length}&lt;/strong&gt; harnesses&lt;br&gt;One growing body of evidence.&lt;/div&gt;&lt;/div&gt;${filters()}${tabs()}${state.view===&#x27;problems&#x27;?catalogProblems():state.view===&#x27;harnesses&#x27;?catalogHarnesses():state.view===&#x27;saved&#x27;?catalogHarnesses(true):matrix()}`;
  }
  const backButton = () =&gt; `&lt;button type=&quot;button&quot; class=&quot;rh-button rh-button-plain rh-back cursor-interaction&quot; data-action=&quot;back&quot;&gt;${icon(&#x27;arrow-left&#x27;)}Back to ${state.view===&#x27;saved&#x27;?&#x27;saved harnesses&#x27;:state.view}&lt;/button&gt;`;
  function runDetail(id) {
    const r=records.find(r=&gt;r.id===id);
    if (!r) return empty(&#x27;This result is unavailable&#x27;,&#x27;Return to the explorer to select another result.&#x27;,&#x27;back&#x27;,&#x27;Back to explorer&#x27;);
    const p=pById(r.problem), h=hById(r.harness);
    const baseline=records.find(b=&gt;b.problem===p.id&amp;&amp;b.harness===&#x27;base&#x27;&amp;&amp;b.model===r.model&amp;&amp;b.environment===r.environment);
    const relative = baseline&amp;&amp;h.id!==&#x27;base&#x27; ? `&lt;div class=&quot;rh-definition&quot;&gt;&lt;strong&gt;Same-condition baseline:&lt;/strong&gt; ${format(p,baseline.value)} at ${money(baseline.cost)} per run with Model only v1.0. The harness result is ${r.value===baseline.value?&#x27;equal to&#x27;:r.value*p.direction&gt;baseline.value*p.direction?&#x27;better than&#x27;:&#x27;worse than&#x27;} the baseline on this criterion.&lt;/div&gt;`:&#x27;&#x27;;
    return `${backButton()}&lt;div class=&quot;rh-detail-head&quot;&gt;&lt;div&gt;&lt;div class=&quot;rh-eyebrow&quot;&gt;Run record · ${esc(p.code)}&lt;/div&gt;&lt;h1&gt;${esc(h.name)} × ${esc(p.name)}&lt;/h1&gt;&lt;p class=&quot;rh-subtitle&quot;&gt;${modelName(r.model)} · ${environmentName(r.environment)} · fictional example result&lt;/p&gt;&lt;/div&gt;${button(icon(&#x27;boxes&#x27;)+&#x27;Harness profile&#x27;,&#x27;harness&#x27;,`data-id=&quot;${h.id}&quot;`)}&lt;/div&gt;
    &lt;div class=&quot;rh-detail-grid&quot;&gt;
      &lt;div&gt;&lt;section class=&quot;rh-panel&quot;&gt;&lt;div class=&quot;rh-metrics&quot;&gt;&lt;div class=&quot;rh-metric&quot;&gt;&lt;div class=&quot;rh-metric-label&quot;&gt;${esc(p.metric)}&lt;/div&gt;&lt;div class=&quot;rh-metric-value&quot;&gt;${format(p,r.value)}&lt;/div&gt;&lt;div class=&quot;rh-metric-unit&quot;&gt;${esc(p.aggregate)}&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;rh-metric&quot;&gt;&lt;div class=&quot;rh-metric-label&quot;&gt;Average cost per run&lt;/div&gt;&lt;div class=&quot;rh-metric-value&quot;&gt;${money(r.cost)}&lt;/div&gt;&lt;div class=&quot;rh-metric-unit&quot;&gt;${money(r.cost*r.runs)} across ${r.runs} runs&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;h3&gt;What counts as progress?&lt;/h3&gt;&lt;div class=&quot;rh-definition&quot;&gt;${esc(p.criteria)}&lt;/div&gt;${relative}&lt;/section&gt;
      &lt;section class=&quot;rh-panel&quot;&gt;&lt;h3&gt;Evidence &amp; reproducibility&lt;/h3&gt;&lt;div class=&quot;rh-record-banner ${r.checked?&#x27;&#x27;:&#x27;reported&#x27;}&quot;&gt;${icon(r.checked?&#x27;badge-check&#x27;:&#x27;circle-dashed&#x27;)}&lt;div&gt;&lt;strong&gt;${r.checked?&#x27;Independently checked&#x27;:&#x27;Self-reported by the contributor&#x27;}&lt;/strong&gt;&lt;br&gt;${r.checked?&#x27;Example status: all 10 runs were replayed against the pinned harness and problem version.&#x27;:&#x27;Supporting outputs are provided in this example. No independent replay has been recorded.&#x27;}&lt;/div&gt;&lt;/div&gt;&lt;p class=&quot;rh-definition&quot;&gt;A checked run supports this result under these conditions. It does not guarantee generalization or rule out overfitting.&lt;/p&gt;${p.later?`&lt;p class=&quot;rh-definition&quot;&gt;&lt;strong&gt;Later-problem evidence.&lt;/strong&gt; This problem was introduced on ${esc(p.introduced)}, after ${esc(h.name)} v${esc(h.version)} was submitted on ${esc(h.submitted)}. The example uses that unchanged version.&lt;/p&gt;`:&#x27;&#x27;}
      &lt;button type=&quot;button&quot; class=&quot;rh-button rh-output-toggle cursor-interaction&quot; data-action=&quot;toggle-output&quot; aria-expanded=&quot;${state.output}&quot;&gt;${icon(state.output?&#x27;chevron-up&#x27;:&#x27;file-text&#x27;)}${state.output?&#x27;Hide&#x27;:&#x27;Inspect&#x27;} example output&lt;/button&gt;
      ${state.output?`&lt;div class=&quot;rh-output&quot; style=&quot;margin-top:13px&quot;&gt;&lt;strong&gt;ILLUSTRATIVE RECORD — NOT AN ACTUAL EXECUTION&lt;/strong&gt;&lt;br&gt;problem: ${esc(p.code)} / specification v1&lt;br&gt;harness: ${esc(h.name)} v${esc(r.version)}&lt;br&gt;batch: 10 independent runs · seeds 101–110&lt;br&gt;metric: ${esc(p.metric)} = ${format(p,r.value)}&lt;br&gt;aggregation: ${esc(p.aggregate)}&lt;br&gt;cost: ${money(r.cost)} mean / ${money(r.cost*10)} total&lt;br&gt;evidence: ${r.checked?&#x27;independent replay recorded&#x27;:&#x27;contributor report only&#x27;}&lt;br&gt;resources: ${r.environment===&#x27;restricted&#x27;?&#x27;approved tools + model calls; public internet disabled&#x27;:&#x27;public internet enabled; separate evaluation setting&#x27;}&lt;br&gt;&lt;strong&gt;No real artifact or verification log is attached to this demo.&lt;/strong&gt;&lt;/div&gt;`:&#x27;&#x27;}
      &lt;/section&gt;&lt;/div&gt;

  const frame = document.getElementById("codex-visualization");
  if (!(frame instanceof HTMLIFrameElement)) {
    return;
  }
  let viewportHeight = globalThis.innerHeight;
  const storageKey = `codex:visualization-widget-state-v2:${JSON.stringify([
    globalThis.location.pathname,
    globalThis.location.search,
  ])}`;
  const parseState = (serializedState) => {
    if (
      typeof serializedState !== "string" ||
      new TextEncoder().encode(serializedState).length > 16 * 1024
    ) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    /** @type {unknown} */
    const state = JSON.parse(serializedState);
    if (
      state == null ||
      typeof state !== "object" ||
      Array.isArray(state) ||
      ("imageIds" in state &&
        (!Array.isArray(state.imageIds) || state.imageIds.length > 0))
    ) {
      throw new TypeError("Widget state must be a JSON object");
    }
    const storedState = { modelContent: null, privateContent: null, ...state };
    const canonicalState = JSON.stringify(
      storedState,
      (_key, /** @type {unknown} */ value) => {
        if (typeof value === "number" && !Number.isFinite(value)) {
          throw new TypeError("Widget state must contain finite numbers");
        }
        return value;
      },
    );
    if (new TextEncoder().encode(canonicalState).length > 16 * 1024) {
      throw new TypeError(
        "Widget state must be a JSON object of at most 16 KiB",
      );
    }
    return storedState;
  };
  let storage = null;
  let state = null;
  try {
    const localStorage = globalThis.localStorage;
    const probeKey = `${storageKey}:probe`;
    localStorage.setItem(probeKey, "1");
    localStorage.removeItem(probeKey);
    storage = localStorage;
    const savedState = storage.getItem(storageKey);
    if (savedState != null) {
      try {
        state = parseState(savedState);
      } catch {
        // Invalid saved state does not disable future writes.
      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
