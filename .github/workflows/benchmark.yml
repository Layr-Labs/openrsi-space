name: Catalyst Benchmark

on:
  workflow_dispatch:
    inputs:
      yukon_evaluation:
        description: Yukon Pareto policies and requested fields
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CATALYST_EVALUATOR_URL: ${{ vars.CATALYST_EVALUATOR_URL }}
    steps:
      - name: Checkout dispatched source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
          python-version: "3.12"
      - name: Setup trusted evaluation client
        run: uv sync --frozen
      - name: Setup private verifier connection
        env:
          CATALYST_SSH_HOST: ${{ vars.CATALYST_SSH_HOST }}
          CATALYST_SSH_USER: ${{ vars.CATALYST_SSH_USER }}
          CATALYST_SSH_KEY: ${{ secrets.CATALYST_SSH_KEY }}
          CATALYST_SSH_KNOWN_HOSTS: ${{ secrets.CATALYST_SSH_KNOWN_HOSTS }}
        run: bash scripts/github-tunnel.sh
      - name: Benchmark — retrieve verified receipt
        env:
          YUKON_EVALUATION: ${{ inputs.yukon_evaluation }}
        run: uv run --frozen catalyst yukon-run
      - name: Upload verified judgment
        uses: actions/upload-artifact@v4
        with:
          name: catalyst-score
          path: .catalyst/yukon/score.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Close private verifier connection
        if: always()
        run: |
          if test -S "$RUNNER_TEMP/catalyst-tunnel/control"; then
            ssh -S "$RUNNER_TEMP/catalyst-tunnel/control" -O exit localhost || true
          fi
          rm -f "$RUNNER_TEMP/catalyst-tunnel/key"
